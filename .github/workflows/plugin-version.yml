# The Claude Code plugin's version, bumped by itself: a push to main that changes what the plugin ships
# (anything in plugin/: its hooks, types, bundled CLI, manifest) gets the patch version in
# plugin/.claude-plugin/plugin.json raised and committed back, so installed copies pick the change up on
# their next update. A push that already raised the version by hand is left as it is. The VS Code extension's version lives in tags (release.yml).
name: plugin-version

on:
  push:
    branches: [main]
    paths:
      - "plugin/**"

permissions:
  contents: write

concurrency:
  group: plugin-version
  cancel-in-progress: false

jobs:
  bump:
    # not the workflow's own commit
    if: ${{ !startsWith(github.event.head_commit.message, 'Version ') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: bump unless this push did
        id: v
        run: |
          if node .github/scripts/plugin-version.js --check HEAD; then
            echo "already raised by this push"
            exit 0
          fi
          echo "ver=$(node .github/scripts/plugin-version.js)" | tee -a "$GITHUB_OUTPUT"
      - name: commit
        if: ${{ steps.v.outputs.ver != '' }}
        env:
          VER: ${{ steps.v.outputs.ver }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin/.claude-plugin/plugin.json
          git commit -m "Version $VER so installed copies pick up the plugin's changes"
          git push origin HEAD:main
