# Manual release, run from the Actions tab. The version lives in tags only:
# MAJOR.MINOR is one minor past the highest vMAJOR.MINOR.* tag (or the next major with
# minor 0 when "Bump Major Version" is checked) and PATCH is the commit count, so every
# release number is derivable from the repository. Files are stamped at build time, never
# committed. Builds a self-contained .vsix per platform plus hesperus.skill, tags, and
# publishes the GitHub release (and the Marketplace / Open VSX when the VSCE_PAT /
# OVSX_PAT secrets exist). Refused when nothing changed since the last release.
name: release
on:
  workflow_dispatch:
    inputs:
      major:
        description: "Bump Major Version"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      ver: ${{ steps.v.outputs.ver }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        env:
          MAJOR: ${{ inputs.major }}
        run: |
          set -euo pipefail
          last=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
          if [ -n "$last" ] && [ "$(git rev-list --count "v$last..HEAD")" = 0 ]; then
            echo "::error::no commits since v$last; nothing to release"
            exit 1
          fi
          mm=${last:-0.0.0}; mm=${mm%.*}            # MAJOR.MINOR of the last release
          if [ "$MAJOR" = true ]; then next=$(( ${mm%.*} + 1 )).0
          else next=${mm%.*}.$(( ${mm#*.} + 1 ))
          fi
          ver="$next.$(git rev-list --count HEAD)"
          echo "ver=$ver" | tee -a "$GITHUB_OUTPUT"

  package:
    needs: version
    strategy:
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
          - os: macos-13
            target: darwin-x64
          - os: ubuntu-latest
            target: linux-x64
          - os: windows-latest
            target: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash scripts/set-version.sh ${{ needs.version.outputs.ver }}
      - run: bash scripts/package-vsix.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: "*.vsix"

  release:
    needs: [version, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: bash scripts/package-skill.sh dist/hesperus.skill
      - name: release notes
        run: |
          last=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
          git log --no-merges --format='- %s' ${last:+v$last..}HEAD | grep . > notes.md || echo "- No changes" > notes.md
          cat notes.md
      - name: tag
        env:
          VER: ${{ needs.version.outputs.ver }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$VER"
          git push origin "v$VER"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.ver }}
          name: v${{ needs.version.outputs.ver }}
          body_path: notes.md
          files: |
            dist/*.vsix
            dist/hesperus.skill
      - if: ${{ env.VSCE_PAT != '' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: for f in dist/*.vsix; do npx @vscode/vsce publish --packagePath "$f"; done
      - if: ${{ env.OVSX_PAT != '' }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: for f in dist/*.vsix; do npx ovsx publish "$f" -p "$OVSX_PAT"; done
