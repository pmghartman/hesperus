# manual release: one past the highest vMAJOR.MINOR tag (minor, or major with .0 when
# checked), tested, built as one VSIX (the CLI is JavaScript run on the editor's own Node),
# published to the VS Code Marketplace through Microsoft Entra ID, then tagged and released on GitHub;
# then only the two newest releases and runs kept
# the version lives in tags only; files are stamped at build time, never committed
# needs vars AZURE_CLIENT_ID (a user-assigned managed identity) and AZURE_TENANT_ID, and the
# `marketplace` environment
name: release

on:
  workflow_dispatch:
    inputs:
      major:
        description: "Bump Major Version"
        type: boolean
        default: false

permissions:
  contents: read

# one release at a time: the next version is read off the tags
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ver: ${{ steps.v.outputs.ver }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # every run one past the highest vMAJOR.MINOR tag: minor, or major with .0; refused when
      # nothing has changed since that tag
      - name: next version
        id: v
        env:
          MAJOR: ${{ inputs.major }}
        run: |
          L=$(git ls-remote --tags origin | sed -n 's|.*refs/tags/v\([0-9]*\.[0-9]*\)$|\1|p' | sort -t. -k1,1n -k2,2n | tail -1)
          L=${L:-0.0}
          if [ "$L" != 0.0 ] && [ "$(git rev-list --count "v$L..HEAD")" = 0 ]; then
            echo "::error::no commits since v$L; nothing to release"
            exit 1
          fi
          if [ "$MAJOR" = true ]; then V=$(( ${L%.*} + 1 )).0
          else V=${L%.*}.$(( ${L#*.} + 1 ))
          fi
          echo "ver=$V" | tee -a "$GITHUB_OUTPUT"
      # the Marketplace's changelog tab: each release's commit subjects, newest first;
      # notes.md, this release's alone, for the GitHub release
      - name: changelog
        env:
          VER: ${{ steps.v.outputs.ver }}
        run: |
          tags=$(git tag -l | grep -E '^v[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -t. -k1,1n -k2,2n | sed 's/^/v/')
          log() { git log --no-merges --format='- %s' "$1" | grep . || echo "- No changes"; }
          p=""; : > older.md
          for t in $tags; do
            { echo "## ${t#v}.0"; echo; log "${p:+$p..}$t"; echo; cat older.md; } > tmp.md && mv tmp.md older.md
            p=$t
          done
          log "${p:+$p..}HEAD" > notes.md
          { echo "# Changelog"; echo; echo "## $VER.0"; echo; cat notes.md; echo; cat older.md; } > CHANGELOG.md
          cat CHANGELOG.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: changelog
          path: |
            CHANGELOG.md
            notes.md
          retention-days: 1

  # tests gating the release, including the determinism and golden snapshot tests. Pure
  # TypeScript, so one OS; Node 20 is the oldest the editors in `engines` run the CLI on
  check:
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - working-directory: vscode
        run: npm ci
      # compile on its own line, so a type error reads as one, not a failed test run
      - name: typecheck
        working-directory: vscode
        run: npm run build
      - name: test
        working-directory: vscode
        run: node scripts/test.js

  # one VSIX for every platform: no native code inside
  build:
    needs: [version]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VER: ${{ needs.version.outputs.ver }}.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: changelog
          path: ${{ runner.temp }}/changelog
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      # the version goes into the cache header too, so an update re-indexes
      - name: package
        working-directory: vscode
        run: |
          npm version "$VER" --no-git-tag-version --allow-same-version
          cp "$RUNNER_TEMP/changelog/CHANGELOG.md" CHANGELOG.md
          npm ci
          npx vsce package -o hesperus-$VER.vsix
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vsix
          path: vscode/hesperus-${{ env.VER }}.vsix
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  # Marketplace first: a failed publish leaves no tag, so the next run reuses the version
  publish:
    needs: [version, check, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: marketplace
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: vsix
          path: dist
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      # only vsce, at the version pinned in vscode/package.json; --azure-credential takes the
      # Azure CLI login above
      - run: |
          V=$(node -p "require('./vscode/package.json').devDependencies['@vscode/vsce']")
          npx --yes "@vscode/vsce@$V" publish --azure-credential --packagePath dist/*.vsix

  release:
    needs: [version, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VER: ${{ needs.version.outputs.ver }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: vsix
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: changelog
          path: changelog
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: v${{ env.VER }}
          name: Hesperus ${{ env.VER }}
          target_commitish: ${{ github.sha }}
          body_path: changelog/notes.md
          files: dist/*.vsix

  # only the two newest numbered releases and tags kept; the next version is read off the
  # highest tag and the changelog off the tags left. Only this workflow's two newest runs, this one included,
  # and the two newest `marketplace` deployments
  prune:
    needs: [release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
      deployments: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: releases
        run: |
          gh release list --limit 200 --json tagName,createdAt --jq '[.[] | select(.tagName | test("^v[0-9]"))] | sort_by(.createdAt) | reverse | .[2:] | .[].tagName' |
          while read -r t; do
            echo "deleting release $t"
            gh release delete "$t" --yes --cleanup-tag
          done
      - name: tags
        run: |
          gh api --paginate "repos/$GH_REPO/git/matching-refs/tags/v" --jq '.[].ref | ltrimstr("refs/tags/") | select(test("^v[0-9]+[.][0-9]+$"))' |
          sort -t. -k1.2,1n -k2,2n | head -n -2 |
          while read -r t; do
            echo "deleting tag $t"
            gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$t"
          done
      - name: runs
        run: |
          gh run list --workflow release.yml --limit 200 --json databaseId,createdAt,status --jq 'sort_by(.createdAt) | reverse | .[2:] | .[] | select(.status == "completed") | .databaseId' |
          while read -r id; do
            echo "deleting run $id"
            gh run delete "$id" || true
          done
      - name: deployments
        run: |
          # a deployment must be inactive before it can be deleted
          gh api "repos/$GH_REPO/deployments?environment=marketplace&per_page=100" --jq 'sort_by(.created_at) | reverse | .[2:] | .[].id' |
          while read -r id; do
            echo "deleting deployment $id"
            gh api -X POST "repos/$GH_REPO/deployments/$id/statuses" -f state=inactive > /dev/null || true
            gh api -X DELETE "repos/$GH_REPO/deployments/$id" || true
          done
