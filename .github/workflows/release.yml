# Release Hesperus. Run it from the Actions tab ("Run workflow"): it sets the version,
# commits, creates the tag, builds a self-contained .vsix per platform plus the
# hesperus.skill bundle, and publishes the GitHub release (and the Marketplace / Open VSX
# when the VSCE_PAT / OVSX_PAT secrets exist). Pushing a v* tag by hand releases that
# tag the same way. Nothing runs on ordinary pushes.
name: release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (X.Y.Z). Empty: the version already in package.json."
        required: false
        default: ""
  push:
    tags: ["v*"]

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: v
        env:
          REQUESTED: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          current=$(node -p "require('./package.json').version")
          version="${REQUESTED:-$current}"
          if [ "$version" != "$current" ]; then
            bash scripts/set-version.sh "$version"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -am "Release v$version"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "tag v$version already exists; pick a new version" >&2
            exit 1
          fi
          git tag "v$version"
          git push origin "v$version"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  package:
    needs: tag
    strategy:
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
          - os: macos-13
            target: darwin-x64
          - os: ubuntu-latest
            target: linux-x64
          - os: windows-latest
            target: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash scripts/package-vsix.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: "*.vsix"

  release:
    needs: [tag, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: bash scripts/package-skill.sh dist/hesperus.skill
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.vsix
            dist/hesperus.skill
      - if: ${{ env.VSCE_PAT != '' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: for f in dist/*.vsix; do npx @vscode/vsce publish --packagePath "$f"; done
      - if: ${{ env.OVSX_PAT != '' }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: for f in dist/*.vsix; do npx ovsx publish "$f" -p "$OVSX_PAT"; done
