[workspace]
resolver = "2"
members = ["crates/hesperus-core", "crates/hesp", "crates/hesperus-lsp"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/pmghartman/hesperus"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
