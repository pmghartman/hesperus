[package]
name = "hesperus-core"
version.workspace = true
edition.workspace = true

[dependencies]
# SCIP is protobuf; prost decodes it (messages hand-written, no protoc).
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Content hashes and lockfile hash.
sha2 = "0.10"
