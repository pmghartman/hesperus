<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="112 112 800 800" width="24" height="24">
  <!-- the activity bar's template of icon.svg: one color, its alpha the shape, the weave shown by
       gaps (the arch over the stem at the shoulder, the leg over the arch) -->
  <defs>
    <polygon id="stem" points="270,232 424,226 424,668 314,668 314,282 270,282"/>
    <path id="arch" d="M314,446 A235,250 0 0,1 784,446 L674,446 A125,145 0 0,0 424,446 Z"/>
    <path id="leg" d="M674,234.3 A235,250 0 0,1 784,446 L784,848 L674,848 Z"/>
    <mask id="m-stem" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <use xlink:href="#arch" fill="#000" stroke="#000" stroke-width="56"/>
    </mask>
    <mask id="m-arch" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <use xlink:href="#leg" fill="#000" stroke="#000" stroke-width="56"/>
    </mask>
  </defs>
  <use xlink:href="#stem" fill="#000" mask="url(#m-stem)"/>
  <use xlink:href="#arch" fill="#000" mask="url(#m-arch)"/>
  <use xlink:href="#leg" fill="#000"/>
</svg>
